name: Temporary backend image publish

on:
  push:
    branches:
      - feature/compliance-scenario-suite

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested source commit
        uses: actions/checkout@v4
        with:
          ref: e69aa746591fa89c54381cdce07697c9892684f2

      - name: Sign in to Azure Container Registry
        env:
          ACR_PASSWORD: ${{ secrets.TEMP_ACR_PUSH_TOKEN }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login complywiseacr.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push backend image
        id: image
        run: |
          docker buildx build --platform linux/amd64 \
            --file backend/Dockerfile \
            --tag complywiseacr.azurecr.io/complywise-backend:e69aa746591fa89c54381cdce07697c9892684f2 \
            --metadata-file /tmp/backend-image-metadata.json \
            --push backend

      - name: Report image digest
        run: echo "Published digest: $(jq -r '.["containerimage.digest"]' /tmp/backend-image-metadata.json)"
